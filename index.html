<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronic Space — Cosmic Engine</title>
<style>
:root{
  --bg:#0b0b0b;
  --text:#ffffff;
  --accent:#4a9eff;
  --radius:12px;
  --shadow:20px;
  --glow:0px;
  --layout-width:900px;
  --star-color:#ffffff;
  --particle-color:cyan;
  --brightness:1;
  --anim-scale:1;
}
/* Controller (Theme Changer) */
.controller{
  position:fixed; top:20px; right:20px; width:340px; padding:18px; background:linear-gradient(180deg, rgba(0,0,0,0.9), rgba(10,10,10,0.85));
  border-radius:12px; z-index:1200; transform:translateX(380px); transition:transform .28s ease; box-shadow:0 6px 30px rgba(0,0,0,.6); color:var(--text);
}
.controller.open{ transform:translateX(0); }
.controller h3{ margin:0 0 8px 0; font-size:14px }
.controller label{ font-size:13px; display:block; margin-bottom:6px }
.controller input[type=color], .controller input[type=range], .controller select, .controller button{ width:100%; margin-bottom:8px }
.controller .row{ display:flex; gap:8px }
.controller .row>button{ flex:1 }
#controllerToggle{ position:fixed; right:20px; bottom:20px; width:64px; height:64px; border-radius:12px; background:linear-gradient(135deg,var(--accent),#7fb8ff); border:none; z-index:1300; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:22px }
#controllerToggle span{ font-weight:700 }
.sr-only{ position:absolute; left:-9999px }
/* Page base */
body{ margin:0; font-family:Arial, sans-serif; color:var(--text); background:radial-gradient(circle at center,var(--bg), #000 70%); filter:brightness(var(--brightness)); transition:background .4s ease, filter .3s ease }
/* Banner area */
#banner{ position:relative; width:100%; height:55vh; min-height:320px; overflow:hidden; z-index:10; margin-top:40px }
#banner img{ position:absolute; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.2s ease }
#banner img.active{ opacity:1 }
.smoke{ position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; background-size:cover; opacity:0.12; transition:opacity .3s ease }
/* mecard is now positioned inside banner */
#mecard{ position:absolute; width:140px; height:auto; z-index:20; right:12px; top:12px; transform-origin:center center; animation:spinForever calc(3s / var(--anim-scale)) linear infinite; cursor:pointer; transition:transform 800ms ease, left 800ms ease, top 800ms ease, opacity .3s }
@keyframes spinForever{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
/* stars & particles */
.stars{ position:absolute; inset:0; z-index:2; pointer-events:none }
.star{ position:absolute; width:2px; height:2px; background:var(--star-color); border-radius:50%; animation:twinkle calc(2s / var(--anim-scale)) infinite ease-in-out }
@keyframes twinkle{ 0%{opacity:.2}50%{opacity:1}100%{opacity:.2} }
#particles{ position:absolute; inset:0; z-index:3; pointer-events:none }
.particle{ position:absolute; width:3px; height:3px; background:var(--particle-color); border-radius:50%; animation:rise calc(6s / var(--anim-scale)) linear infinite }
@keyframes rise{ 0%{transform:translateY(0);opacity:.4}100%{transform:translateY(-200px);opacity:0} }
/* symbols/dollar particles */
.symbol{ position:absolute; font-size:14px; opacity:.8; pointer-events:none; animation:riseSym calc(6s / var(--anim-scale)) linear infinite }
@keyframes riseSym{ 0%{transform:translateY(0); opacity:.9}100%{transform:translateY(-220px); opacity:0} }
/* founder modal */
#founderModal{ position:fixed; inset:0; display:none; justify-content:center; align-items:center; background:rgba(0,0,0,.86); z-index:2000 }
#founderCard{ width:360px; background:linear-gradient(180deg,#070707,#111); border-radius:14px; padding:18px; border:3px solid var(--accent); box-shadow:0 0 calc(var(--shadow)*1px) var(--accent); text-align:center }
.founderImage{ width:100%; border-radius:10px; margin-bottom:12px }
.socialRow{ display:flex; justify-content:space-around; margin:12px 0 }
.socialIcon{ width:46px; height:46px; border-radius:50%; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold }
.fb{ background:#1877f2 } .yt{ background:#ff0000 } .x{ background:#000 } .li{ background:#0a66c2 }
#closeFounder{ margin-top:6px; padding:10px 18px; border-radius:8px; background:var(--accent); border:none; font-weight:bold }
/* responsive */
@media(max-width:600px){ .controller{ width:92% } #mecard{ width:110px } }
</style>
</head>
<body>
<!-- Theme Changer Toggle -->
<button id="controllerToggle" aria-controls="styleController" aria-expanded="false" title="Theme Changer"><span>🎨</span></button>
<div class="controller" id="styleController" role="region" aria-label="Theme Changer">
  <div class="sr-only">Theme Changer</div>
  <h3>Theme Effects</h3>
  <label for="patternSelect">Background Effect</label>
  <select id="patternSelect">
    <option value="starfield">Starfield</option>
    <option value="nebula">Nebula</option>
    <option value="grid">Grid</option>
    <option value="noise">Noise</option>
    <option value="fire">Fire</option>
    <option value="symbols">Symbols</option>
    <option value="dollars">Dollar Signs</option>
  </select>

  <label for="symbolChar">Symbol (for Symbols option)</label>
  <select id="symbolChar">
    <option value="★">Star ★</option>
    <option value="✦">Spark ✦</option>
    <option value="$">Dollar $</option>
    <option value="∞">Infinity ∞</option>
    <option value="☽">Moon ☽</option>
  </select>

  <label for="bgColor">Background Color</label>
  <input id="bgColor" type="color" value="#0b0b0b">

  <label for="accentColor">Accent Color</label>
  <input id="accentColor" type="color" value="#4a9eff">

  <label for="brightness">Brightness</label>
  <input id="brightness" type="range" min="0.6" max="1.4" step="0.01" value="1">

  <label for="animIntensity">Animation Intensity</label>
  <input id="animIntensity" type="range" min="0.4" max="2" step="0.1" value="1">

  <label for="starDensity">Star Density</label>
  <input id="starDensity" type="range" min="0" max="300" value="150">

  <label for="particleDensity">Particle Density</label>
  <input id="particleDensity" type="range" min="0" max="200" value="60">

  <div class="row">
    <button id="saveTheme">Save</button>
    <button id="resetTheme">Reset</button>
  </div>
</div>

<!-- Banner and effects -->
<div id="banner">
  <div class="smoke" aria-hidden="true"></div>
  <div class="stars" id="stars"></div>
  <div id="particles"></div>
  <img src="images/BANNER1.jpeg" alt="Banner 1" loading="lazy">
  <img src="images/BANNER2.jpeg" alt="Banner 2" loading="lazy">
  <img src="images/BANNER3.jpeg" alt="Banner 3" loading="lazy">
  <img src="images/BANNER4.jpeg" alt="Banner 4" loading="lazy">
  <img src="images/BANNER5.jpeg" alt="Banner 5" loading="lazy">
  <img src="images/BANNER6.jpeg" alt="Banner 6" loading="lazy">
  <img src="images/BANNER7.jpeg" alt="Banner 7" loading="lazy">
  <!-- MECARD inside banner so it only floats over the banner -->
  <img id="mecard" src="images/MECARD.png" alt="Mecard" loading="lazy" tabindex="0" aria-label="Open founder links">
</div>

<!-- Founder modal -->
<div id="founderModal" role="dialog" aria-modal="true" aria-labelledby="founderTitle">
  <div id="founderCard">
    <img src="images/MECARD.png" class="founderImage" alt="Founder">
    <h2 id="founderTitle">CHRONIC SPACE FOUNDER</h2>
    <div class="socialRow">
      <div class="socialIcon fb" onclick="window.open('https://www.facebook.com/chroniccody','_blank')" aria-label="Facebook">f</div>
      <div class="socialIcon yt" onclick="window.open('https://www.youtube.com/@ChronicSpace','_blank')" aria-label="YouTube">▶</div>
      <div class="socialIcon x" onclick="window.open('https://x.com/AmaBurnSpace','_blank')" aria-label="X">X</div>
      <div class="socialIcon li" onclick="window.open('https://www.linkedin.com/in/founderchronicspace/','_blank')" aria-label="LinkedIn">in</div>
    </div>
    <button id="closeFounder">CLOSE</button>
  </div>
</div>

<script>
// Utility
const root = document.documentElement;
const banner = document.getElementById('banner');
const mecard = document.getElementById('mecard');
const starsEl = document.getElementById('stars');
const particlesEl = document.getElementById('particles');
const smoke = document.querySelector('.smoke');
let floatTimer=null; let floating=true; let currentBanner=0; let bannerInterval=null; let animScale=1;

// Banner slideshow
const banners = banner.querySelectorAll('img');
function showBanner(){ banners.forEach((b,i)=>{ b.classList.toggle('active', i===currentBanner); }); currentBanner=(currentBanner+1)%banners.length }
showBanner(); bannerInterval = setInterval(showBanner,5000);

// Floating mecard within banner bounds
function randomFloatInBanner(){ if(!floating) return; const bw=banner.clientWidth, bh=banner.clientHeight; const mW=mecard.clientWidth, mH=mecard.clientHeight; const padding=8; const left = Math.random()*(bw - mW - padding*2) + padding; const top = Math.random()*(bh - mH - padding*2) + padding; mecard.style.left = left + 'px'; mecard.style.top = top + 'px'; floatTimer = setTimeout(randomFloatInBanner, 2200);
}
// start
randomFloatInBanner();

// make stars/particles generative functions
function makeStars(count){ starsEl.innerHTML=''; for(let i=0;i<count;i++){ const s=document.createElement('div'); s.className='star'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.animationDelay=(Math.random()*2)+'s'; starsEl.appendChild(s); } }
function makeParticles(count){ particlesEl.innerHTML=''; for(let i=0;i<count;i++){ const p=document.createElement('div'); p.className='particle'; p.style.left=Math.random()*100+'%'; p.style.top=(Math.random()*100)+'%'; p.style.animationDelay=(Math.random()*6)+'s'; particlesEl.appendChild(p); } }
function makeSymbolParticles(count, char){ particlesEl.innerHTML=''; for(let i=0;i<count;i++){ const s=document.createElement('div'); s.className='symbol'; s.textContent=char; s.style.left=Math.random()*100+'%'; s.style.top=(Math.random()*100)+'%'; s.style.fontSize=(10 + Math.random()*20) + 'px'; s.style.color = getComputedStyle(root).getPropertyValue('--accent') || '#fff'; s.style.animationDelay=(Math.random()*6)+'s'; particlesEl.appendChild(s); } }

// Patterns
function setPattern(name, symbolChar){ // clear overlays
  // default: small smoke opacity
  smoke.style.opacity = (name==='starfield') ? 0 : 0.12;
  smoke.style.backgroundImage='none';
  particlesEl.innerHTML=''; starsEl.innerHTML='';
  switch(name){
    case 'starfield':
      makeStars(parseInt(document.getElementById('starDensity').value,10) || 120);
      makeParticles(parseInt(document.getElementById('particleDensity').value,10) || 40);
      break;
    case 'nebula':
      smoke.style.backgroundImage = "url('https://i.imgur.com/8fK4h7R.png')"; smoke.style.opacity=0.14; makeStars(90); makeParticles(60); break;
    case 'grid':
      smoke.style.backgroundImage = "linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px)"; smoke.style.backgroundSize='40px 40px,40px 40px'; smoke.style.opacity=0.06; break;
    case 'noise':
      smoke.style.backgroundImage = "url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'400\'><filter id=\'n\'><feTurbulence baseFrequency=\'0.9\' numOctaves=\'2\' stitchTiles=\'stitch\'/></filter><rect width=\'100%\' height=\'100%\' filter=\'url(%23n)\' fill=\'white\'/></svg>')"; smoke.style.opacity=0.06; break;
    case 'fire':
      // simple CSS gradient-based fire impression
      smoke.style.backgroundImage = "radial-gradient(circle at 50% 70%, rgba(255,140,0,0.35), rgba(255,40,0,0.15) 20%, transparent 45%), linear-gradient(180deg, rgba(255,80,0,0.06), transparent)"; smoke.style.opacity=0.18; makeParticles(40); break;
    case 'symbols':
      makeSymbolParticles(parseInt(document.getElementById('particleDensity').value,10)||60, symbolChar||'★'); break;
    case 'dollars':
      makeSymbolParticles(parseInt(document.getElementById('particleDensity').value,10)||80, '$'); break;
    default:
      makeStars(120); makeParticles(40); break;
  }
}

// mecard click behaviour: hide spinning mecard and show modal; restore on close
mecard.addEventListener('click', ()=>{
  // hide mecard
  mecard.style.opacity = '0'; mecard.style.pointerEvents='none';
  setTimeout(()=>{ mecard.style.display='none'; }, 300);
  // show modal
  const modal = document.getElementById('founderModal'); modal.style.display='flex'; document.getElementById('closeFounder').focus();
});
// keyboard activation
mecard.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); mecard.click(); } });

// close modal restores mecard
document.getElementById('closeFounder').addEventListener('click', ()=>{
  const modal = document.getElementById('founderModal'); modal.style.display='none';
  mecard.style.display='block'; setTimeout(()=>{ mecard.style.opacity='1'; mecard.style.pointerEvents='auto'; }, 40);
  // resume floating
  floating=true; randomFloatInBanner();
});

// Controller wiring
const toggle = document.getElementById('controllerToggle'); const controller = document.getElementById('styleController');
toggle.addEventListener('click', ()=>{ const open = controller.classList.toggle('open'); toggle.setAttribute('aria-expanded', open?'true':'false'); if(open) controller.querySelector('select, input, button').focus(); else toggle.focus(); });

// controls
const patternSelect = document.getElementById('patternSelect');
const symbolChar = document.getElementById('symbolChar');
const bgColor = document.getElementById('bgColor');
const accentColor = document.getElementById('accentColor');
const brightness = document.getElementById('brightness');
const animIntensity = document.getElementById('animIntensity');
const starDensity = document.getElementById('starDensity');
const particleDensity = document.getElementById('particleDensity');

function applyUI(){ root.style.setProperty('--bg', bgColor.value); root.style.setProperty('--accent', accentColor.value); root.style.setProperty('--brightness', brightness.value); animScale = parseFloat(animIntensity.value); root.style.setProperty('--anim-scale', animScale); document.querySelectorAll('.star').forEach(s=>s.style.animationDuration = (2/animScale)+'s'); document.querySelectorAll('.particle').forEach(p=>p.style.animationDuration = (6/animScale)+'s'); document.getElementById('mecard').style.animationDuration = (3/animScale)+'s'; setPattern(patternSelect.value, symbolChar.value); }

patternSelect.addEventListener('change', ()=>{ applyUI(); }); symbolChar.addEventListener('change', applyUI); bgColor.addEventListener('input', applyUI); accentColor.addEventListener('input', ()=>{ root.style.setProperty('--accent', accentColor.value); applyUI(); }); brightness.addEventListener('input', applyUI); animIntensity.addEventListener('input', applyUI); starDensity.addEventListener('input', ()=>{ makeStars(parseInt(starDensity.value,10)); }); particleDensity.addEventListener('input', ()=>{ setPattern(patternSelect.value, symbolChar.value); });

// save/reset
function saveTheme(){ const data = { pattern:patternSelect.value, symbol:symbolChar.value, bg:bgColor.value, accent:accentColor.value, brightness:brightness.value, animIntensity:animIntensity.value, starDensity:starDensity.value, particleDensity:particleDensity.value }; localStorage.setItem('chronicThemeEffects', JSON.stringify(data)); alert('Theme effects saved locally'); }
function loadTheme(){ try{ const raw=localStorage.getItem('chronicThemeEffects'); if(!raw) return null; return JSON.parse(raw);}catch(e){return null;} }
function resetTheme(){ localStorage.removeItem('chronicThemeEffects'); // defaults
 patternSelect.value='starfield'; symbolChar.value='★'; bgColor.value='#0b0b0b'; accentColor.value='#4a9eff'; brightness.value=1; animIntensity.value=1; starDensity.value=150; particleDensity.value=60; applyUI(); }

document.getElementById('saveTheme').addEventListener('click', saveTheme);
document.getElementById('resetTheme').addEventListener('click', resetTheme);

// init
(function init(){ const saved = loadTheme(); if(saved){ patternSelect.value = saved.pattern || 'starfield'; symbolChar.value = saved.symbol || '★'; bgColor.value = saved.bg || '#0b0b0b'; accentColor.value = saved.accent || '#4a9eff'; brightness.value = saved.brightness || 1; animIntensity.value = saved.animIntensity || 1; starDensity.value = saved.starDensity || 150; particleDensity.value = saved.particleDensity || 60; }
 applyUI(); // start floats
 // respect reduced motion
 if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ document.querySelectorAll('*').forEach(el=>el.style.animation='none'); }
})();

// ensure mecard only within banner on resize
window.addEventListener('resize', ()=>{ // clamp
 const bw=banner.clientWidth, bh=banner.clientHeight, mW=mecard.clientWidth, mH=mecard.clientHeight; const left = parseFloat(mecard.style.left)||0; const top = parseFloat(mecard.style.top)||0; const clampedLeft = Math.min(Math.max(8, left), bw-mW-8); const clampedTop = Math.min(Math.max(8, top), bh-mH-8); mecard.style.left = clampedLeft+'px'; mecard.style.top = clampedTop+'px'; });

</script>
</body>
</html>
