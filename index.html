<!DOCTYPE html>
<html lang="en">
<head>
 <style>
    :root {
        --bg: #111;
        --text: #fff;
        --accent: #4a9eff;
        --radius: 12px;
        --shadow: 20px;
        --glow: 0;
        --layout-width: 900px;
    }

    .controller {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #000;
        padding: 20px;
        border-radius: 10px;
        width: 260px;
        z-index: 999;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.6);
        border: 1px solid #333;
    }

    .controller label {
        font-size: 14px;
        margin-bottom: 5px;
        display: block;
    }

    .controller input[type="range"],
    .controller input[type="color"] {
        width: 100%;
        margin-bottom: 15px;
    }
</style>
   
<meta charset="UTF-8">
<title>Chronic Space Cosmic Engine</title>

<style>
    body {
        margin: 0;
        background: radial-gradient(circle at center, #0a0a0a, #000000 70%);
        overflow-x: hidden;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* PARALLAX STARFIELD */
    .stars {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: none;
    }

    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        opacity: 0.8;
        border-radius: 50%;
        animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
    }

    /* FLOATING PARTICLES */
    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: cyan;
        opacity: 0.4;
        border-radius: 50%;
        animation: rise 6s linear infinite;
    }

    @keyframes rise {
        0% { transform: translateY(0px); opacity: 0.4; }
        100% { transform: translateY(-200px); opacity: 0; }
    }

    /* BANNER AREA */
    #banner {
        position: relative;
        width: 100%;
        height: 550px;
        overflow: hidden;
        z-index: 10;
        margin-top: 40px;
    }

    #banner img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 1.2s ease;
        filter: drop-shadow(0px 0px 15px rgba(0,255,255,0.4));
    }

    #banner img.active {
        opacity: 1;
    }

    /* COSMIC ANIMATIONS */
    @keyframes shimmer {
        0% { filter: brightness(1); }
        50% { filter: brightness(1.4); }
        100% { filter: brightness(1); }
    }

    @keyframes drift {
        0% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.03) rotate(1deg); }
        100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes pulse {
        0% { filter: drop-shadow(0px 0px 10px cyan); }
        50% { filter: drop-shadow(0px 0px 25px cyan); }
        100% { filter: drop-shadow(0px 0px 10px cyan); }
    }

    @keyframes wave {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
    }

    @keyframes warp {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    @keyframes glitch {
        0% { transform: translateX(0px); }
        20% { transform: translateX(-3px); }
        40% { transform: translateX(3px); }
        60% { transform: translateX(-2px); }
        80% { transform: translateX(2px); }
        100% { transform: translateX(0px); }
    }

    @keyframes smoke {
        0% { opacity: 0.1; transform: translateX(0px); }
        50% { opacity: 0.25; transform: translateX(20px); }
        100% { opacity: 0.1; transform: translateX(0px); }
    }

    .smoke {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('https://i.imgur.com/8fK4h7R.png');
        background-size: cover;
        opacity: 0.15;
        animation: smoke 12s infinite linear;
        z-index: 5;
        pointer-events: none;
    }

    /* MECARD FLOATING OBJECT */
    #mecard {
        position: fixed;
        top: 50%;
        left: -200px;
        width: 180px;
        height: auto;
        z-index: 999;
        filter: drop-shadow(0px 0px 15px cyan);
        cursor: pointer;
        transition: transform 1s ease, top 1s ease, left 1s ease;
        animation: spinForever 3s linear infinite;
    }

    @keyframes spinForever {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* FOUNDER MODAL BACKDROP */
    #founderModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }

    /* TAROT-STYLE CARD */
    #founderCard {
        width: 350px;
        background: linear-gradient(180deg, #0a0a0a, #111, #0a0a0a);
        border: 3px solid cyan;
        border-radius: 18px;
        padding: 20px;
        text-align: center;
        box-shadow: 0px 0px 25px cyan;
        animation: cardReveal 0.8s ease;
    }

    @keyframes cardReveal {
        0% { transform: scale(0.4); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .founderImage {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0px 0px 20px cyan;
    }

    /* SOCIAL ICONS */
    .socialRow {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
    }

    .socialIcon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        font-size: 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        color: white;
        font-weight: bold;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .socialIcon:hover {
        transform: scale(1.2);
        box-shadow: 0px 0px 15px cyan;
    }

    .fb { background: #1877f2; }
    .yt { background: #ff0000; }
    .x  { background: #000000; }
    .li { background: #0a66c2; }

    /* CLOSE BUTTON */
    #closeFounder {
        background: cyan;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        color: black;
        transition: background 0.3s ease;
    }

    #closeFounder:hover {
        background: white;
    }
</style>
</head>
<body>
<div class="controller">
    <label>Background Color</label>
    <input id="bg" type="color" value="#111111">

    <label>Text Color</label>
    <input id="text" type="color" value="#ffffff">

    <label>Accent Color</label>
    <input id="accent" type="color" value="#4a9eff">

    <label>Corner Radius</label>
    <input id="radius" type="range" min="0" max="40" value="12">

    <label>Shadow Strength</label>
    <input id="shadow" type="range" min="0" max="60" value="20">

    <label>Glow</label>
    <input id="glow" type="range" min="0" max="40" value="0">

    <label>Layout Width</label>
    <input id="layoutWidth" type="range" min="600" max="1400" value="900">
</div>

<div class="stars" id="stars"></div>
<div id="particles"></div>

<div id="banner">
    <div class="smoke"></div>

    <img src="images/BANNER1.jpeg">
    <img src="images/BANNER2.jpeg">
    <img src="images/BANNER3.jpeg">
    <img src="images/BANNER4.jpeg">
    <img src="images/BANNER5.jpeg">
    <img src="images/BANNER6.jpeg">
    <img src="images/BANNER7.jpeg">
</div>

<!-- MECARD + FOUNDER CARD -->
<img id="mecard" src="images/MECARD.png">

<div id="founderModal">
    <div id="founderCard">
        <img src="images/MECARD.png" class="founderImage">

        <h2>CHRONIC SPACE FOUNDER</h2>

        <div class="socialRow">
            <div class="socialIcon fb" onclick="window.open('https://www.facebook.com/chroniccody','_blank')">f</div>
            <div class="socialIcon yt" onclick="window.open('https://www.youtube.com/@ChronicSpace','_blank')">▶</div>
            <div class="socialIcon x" onclick="window.open('https://x.com/AmaBurnSpace','_blank')">X</div>
            <div class="socialIcon li" onclick="window.open('https://www.linkedin.com/in/founderchronicspace/','_blank')">in</div>
        </div>

        <button id="closeFounder">CLOSE</button>
    </div>
</div>

<script>
    /* STARFIELD */
    const starContainer = document.getElementById("stars");
    for (let i = 0; i < 150; i++) {
        let s = document.createElement("div");
        s.className = "star";
        s.style.top = Math.random() * 100 + "%";
        s.style.left = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 2 + "s";
        starContainer.appendChild(s);
    }

    /* PARTICLES */
    const particleContainer = document.getElementById("particles");
    for (let i = 0; i < 60; i++) {
        let p = document.createElement("div");
        p.className = "particle";
        p.style.top = Math.random() * 100 + "%";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 6 + "s";
        particleContainer.appendChild(p);
    }

    /* RANDOMIZED BANNER ANIMATIONS */
    const animations = [
        "shimmer 4s infinite ease-in-out",
        "drift 6s infinite ease-in-out",
        "pulse 5s infinite ease-in-out",
        "wave 6s infinite ease-in-out",
        "warp 5s infinite ease-in-out",
        "glitch 1s infinite ease-in-out",
    ];

    const banners = document.querySelectorAll("#banner img");
    let current = 0;

    function showBanner() {
        banners.forEach((b) => {
            b.classList.remove("active");
            b.style.animation = "";
        });

        const banner = banners[current];
        banner.classList.add("active");

        const randomAnimation = animations[Math.floor(Math.random() * animations.length)];
        banner.style.animation = randomAnimation;

        current = (current + 1) % banners.length;
    }

    showBanner();
    setInterval(showBanner, 5000);

    /* RANDOM FLOATING PATH FOR MECARD */
    const mecard = document.getElementById("mecard");
    let floating = true;

    function randomFloat() {
        if (!floating) return;

        const randTop = Math.random() * 70 + 10;
        const randLeft = Math.random() * 80 + 10;

        mecard.style.top = randTop + "%";
        mecard.style.left = randLeft + "%";

        setTimeout(randomFloat, 2000);
    }

    randomFloat();

    /* CLICK TO FREEZE + ZOOM + OPEN MENU */
    mecard.addEventListener("click", () => {
        floating = false;

        mecard.style.transition = "transform 1s ease, top 1s ease, left 1s ease";
        mecard.style.top = "50%";
        mecard.style.left = "50%";
        mecard.style.transform = "translate(-50%, -50%) scale(1.3) rotate(0deg)";
        mecard.style.zIndex = "2001";

        setTimeout(() => {
            document.getElementById("founderModal").style.display = "flex";
        }, 900);
    });

    /* CLOSE MENU + RETURN TO CHAOS */
    document.getElementById("closeFounder").addEventListener("click", () => {
        document.getElementById("founderModal").style.display = "none";

        mecard.style.transform = "scale(1)";
        floating = true;
        randomFloat();
    });
</script>
<script>
    const root = document.documentElement;

    document.getElementById("bg").oninput = e => root.style.setProperty("--bg", e.target.value);
    document.getElementById("text").oninput = e => root.style.setProperty("--text", e.target.value);
    document.getElementById("accent").oninput = e => root.style.setProperty("--accent", e.target.value);
    document.getElementById("radius").oninput = e => root.style.setProperty("--radius", e.target.value + "px");
    document.getElementById("shadow").oninput = e => root.style.setProperty("--shadow", e.target.value + "px");
    document.getElementById("glow").oninput = e => root.style.setProperty("--glow", e.target.value + "px");
    document.getElementById("layoutWidth").oninput = e => root.style.setProperty("--layout-width", e.target.value + "px");
</script>

</body>
</html>
