<!DOCTYPE html>
<html lang="en">
<head>
 <style>
    :root {
        --bg: #111;
        --text: #fff;
        --accent: #4a9eff;
        --radius: 12px;
        --shadow: 20px;
        --glow: 0px;
        --layout-width: 900px;
        --star-color: #ffffff;
        --particle-color: cyan;
        --brightness: 1;
        --anim-scale: 1;
    }

    /* CONTROLLER (hidden by default, toggled by the tool button) */
    .controller {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0,0,0,0.9);
        padding: 20px;
        border-radius: var(--radius);
        width: 340px;
        z-index: 999;
        box-shadow: 0 0 var(--shadow) rgba(0,0,0,0.6);
        border: 1px solid rgba(255,255,255,0.06);
        transform: translateX(380px); /* hide off-screen */
        transition: transform 280ms ease;
        backdrop-filter: blur(6px);
        color: var(--text);
    }

    .controller.open {
        transform: translateX(0);
    }

    .controller h3 { margin:0 0 8px 0; font-size:14px; }

    .controller label {
        font-size: 13px;
        margin-bottom: 5px;
        display: block;
        color: var(--text);
    }

    .controller input[type="range"],
    .controller input[type="color"],
    .controller select,
    .controller button {
        width: 100%;
        margin-bottom: 10px;
    }

    .controller .row { display:flex; gap:8px; }
    .controller .row > * { flex:1; }

    /* Controller toggle button (tool icon) */
    #controllerToggle {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #7fb8ff);
        color: black;
        border: none;
        z-index: 1000;
        cursor: pointer;
        box-shadow: 0 4px 18px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
    }

    #controllerToggle:focus { outline: 3px solid rgba(74,158,255,0.35); }

    /* small accessibility hint */
    .sr-only { position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden; }
 </style>
   
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronic Space Cosmic Engine</title>

<style>
    /* Use CSS variables so the controller can change the look */
    body {
        margin: 0;
        background: radial-gradient(circle at center, var(--bg), #000000 70%);
        overflow-x: hidden;
        font-family: Arial, sans-serif;
        color: var(--text);
        filter: brightness(var(--brightness));
        transition: background 400ms ease, filter 300ms ease, color 200ms ease;
    }

    /* PATTERN CLASSES (for future per-theme rules) */
    body.pattern-nebula .smoke { background-image: url('https://i.imgur.com/8fK4h7R.png'); }
    body.pattern-grid .smoke { background-image: linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px, 40px 40px; }
    body.pattern-noise .smoke { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><filter id="n"><feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" fill="white"/></svg>'); opacity:0.06; }
    body.pattern-starfield .smoke { background-image: none; }

    /* PARALLAX STARFIELD */
    .stars {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: none;
    }

    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: var(--star-color);
        opacity: 0.8;
        border-radius: 50%;
        animation: twinkle calc(2s / var(--anim-scale)) infinite ease-in-out;
    }

    @keyframes twinkle { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

    /* FLOATING PARTICLES */
    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: var(--particle-color);
        opacity: 0.4;
        border-radius: 50%;
        animation: rise calc(6s / var(--anim-scale)) linear infinite;
    }

    @keyframes rise { 0% { transform: translateY(0px); opacity: 0.4; } 100% { transform: translateY(-200px); opacity: 0; } }

    /* BANNER AREA */
    #banner {
        position: relative;
        width: 100%;
        height: 55vh;
        min-height: 320px;
        overflow: hidden;
        z-index: 10;
        margin-top: 40px;
    }

    #banner img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 1.2s ease;
        filter: drop-shadow(0px 0px 15px rgba(0,255,255,0.4));
    }

    #banner img.active { opacity: 1; }

    /* COSMIC ANIMATIONS */
    @keyframes shimmer { 0% { filter: brightness(1); } 50% { filter: brightness(1.4); } 100% { filter: brightness(1); } }
    @keyframes drift { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.03) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
    @keyframes pulse { 0% { filter: drop-shadow(0px 0px 10px var(--particle-color)); } 50% { filter: drop-shadow(0px 0px 25px var(--particle-color)); } 100% { filter: drop-shadow(0px 0px 10px var(--particle-color)); } }
    @keyframes wave { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
    @keyframes warp { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes glitch { 0% { transform: translateX(0px); } 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } 100% { transform: translateX(0px); } }

    .smoke {
        position: absolute;
        width: 100%;
        height: 100%;
        background-size: cover;
        opacity: 0.12;
        animation: smoke calc(12s / var(--anim-scale)) infinite linear;
        z-index: 5;
        pointer-events: none;
    }

    @keyframes smoke { 0% { opacity: 0.1; transform: translateX(0px); } 50% { opacity: 0.25; transform: translateX(20px); } 100% { opacity: 0.1; transform: translateX(0px); } }

    /* MECARD FLOATING OBJECT */
    #mecard {
        position: fixed;
        top: 50%;
        left: -200px;
        width: 180px;
        height: auto;
        z-index: 999;
        filter: drop-shadow(0px 0px 15px var(--particle-color));
        cursor: pointer;
        transition: transform 1s ease, top 1s ease, left 1s ease;
        animation: spinForever calc(3s / var(--anim-scale)) linear infinite;
    }

    @keyframes spinForever { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* FOUNDER MODAL BACKDROP */
    #founderModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; }

    /* TAROT-STYLE CARD */
    #founderCard {
        width: 350px;
        background: linear-gradient(180deg, #0a0a0a, #111, #0a0a0a);
        border: 3px solid var(--accent);
        border-radius: var(--radius);
        padding: 20px;
        text-align: center;
        box-shadow: 0 0 calc(var(--shadow) * 1px) var(--accent);
        animation: cardReveal 0.8s ease;
    }

    @keyframes cardReveal { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .founderImage { width: 100%; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 0 20px var(--accent); }

    /* SOCIAL ICONS */
    .socialRow { display: flex; justify-content: space-around; margin: 20px 0; }
    .socialIcon { width: 45px; height: 45px; border-radius: 50%; font-size: 22px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-weight: bold; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .socialIcon:hover { transform: scale(1.2); box-shadow: 0 0 calc(var(--glow) * 1px) var(--accent); }
    .fb { background: #1877f2; }
    .yt { background: #ff0000; }
    .x  { background: #000000; }
    .li { background: #0a66c2; }

    /* CLOSE BUTTON */
    #closeFounder { background: var(--accent); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; color: black; transition: background 0.3s ease; }
    #closeFounder:hover { background: white; }

    /* Responsive tweaks */
    @media (max-width: 600px) { #banner { height: 45vh; } .controller { width: 260px; } }

</style>
</head>
<body>
<!-- Controller toggle button -->
<button id="controllerToggle" aria-controls="styleController" aria-expanded="false" title="Open style controller">🎛</button>
<div class="controller" id="styleController" role="region" aria-label="Style controller">
    <div class="sr-only">Style controller</div>
    <h3>Theme Presets</h3>
    <label for="themeSelect">Choose a Theme</label>
    <select id="themeSelect">
        <option value="custom">Custom</option>
        <option value="neon">Neon</option>
        <option value="classic">Classic Dark</option>
        <option value="solar">Solar</option>
        <option value="pastel">Pastel</option>
    </select>

    <label for="patternSelect">Background Pattern</label>
    <select id="patternSelect">
        <option value="starfield">Starfield</option>
        <option value="nebula">Nebula</option>
        <option value="grid">Grid</option>
        <option value="noise">Noise</option>
    </select>

    <label for="brightness">Brightness</label>
    <input id="brightness" type="range" min="0.5" max="1.5" step="0.01" value="1">

    <label for="animIntensity">Animation Intensity</label>
    <input id="animIntensity" type="range" min="0.4" max="2" step="0.1" value="1">

    <hr style="border-color: rgba(255,255,255,0.06);">

    <h3>Quick Colors & Layout</h3>
    <label for="bg">Background Color</label>
    <input id="bg" type="color" value="#111111">

    <label for="text">Text Color</label>
    <input id="text" type="color" value="#ffffff">

    <label for="accent">Accent Color</label>
    <input id="accent" type="color" value="#4a9eff">

    <label for="radius">Corner Radius</label>
    <input id="radius" type="range" min="0" max="40" value="12">

    <label for="shadow">Shadow Strength</label>
    <input id="shadow" type="range" min="0" max="60" value="20">

    <label for="glow">Glow</label>
    <input id="glow" type="range" min="0" max="40" value="0">

    <label for="layoutWidth">Layout Width</label>
    <input id="layoutWidth" type="range" min="600" max="1400" value="900">

    <label for="starDensity">Star Density</label>
    <input id="starDensity" type="range" min="20" max="400" value="150">

    <label for="particleDensity">Particle Density</label>
    <input id="particleDensity" type="range" min="0" max="200" value="60">

    <div class="row">
        <button id="saveTheme">Save</button>
        <button id="resetTheme">Reset</button>
    </div>

    <div class="row">
        <button id="exportTheme">Export</button>
        <button id="importTheme">Import</button>
    </div>
    <input id="importData" class="sr-only" type="file" accept="application/json">
</div>

<div class="stars" id="stars"></div>
<div id="particles"></div>

<div id="banner">
    <div class="smoke" aria-hidden="true"></div>

    <img src="images/BANNER1.jpeg" alt="Banner 1" loading="lazy">
    <img src="images/BANNER2.jpeg" alt="Banner 2" loading="lazy">
    <img src="images/BANNER3.jpeg" alt="Banner 3" loading="lazy">
    <img src="images/BANNER4.jpeg" alt="Banner 4" loading="lazy">
    <img src="images/BANNER5.jpeg" alt="Banner 5" loading="lazy">
    <img src="images/BANNER6.jpeg" alt="Banner 6" loading="lazy">
    <img src="images/BANNER7.jpeg" alt="Banner 7" loading="lazy">
</div>

<!-- MECARD + FOUNDER CARD -->
<img id="mecard" src="images/MECARD.png" alt="Mecard" loading="lazy">

<div id="founderModal" role="dialog" aria-modal="true" aria-labelledby="founderTitle">
    <div id="founderCard">
        <img src="images/MECARD.png" class="founderImage" alt="Founder">

        <h2 id="founderTitle">CHRONIC SPACE FOUNDER</h2>

        <div class="socialRow">
            <div class="socialIcon fb" onclick="window.open('https://www.facebook.com/chroniccody','_blank')" aria-label="Facebook">f</div>
            <div class="socialIcon yt" onclick="window.open('https://www.youtube.com/@ChronicSpace','_blank')" aria-label="YouTube">▶</div>
            <div class="socialIcon x" onclick="window.open('https://x.com/AmaBurnSpace','_blank')" aria-label="X">X</div>
            <div class="socialIcon li" onclick="window.open('https://www.linkedin.com/in/founderchronicspace/','_blank')" aria-label="LinkedIn">in</div>
        </div>

        <button id="closeFounder">CLOSE</button>
    </div>
</div>

<script>
    /* THEME PRESETS */
    const THEMES = {
        neon: {
            name:'neon',
            bg: '#05060a',
            text: '#e8f7ff',
            accent: '#00ffd5',
            radius: 14,
            shadow: 28,
            glow: 12,
            layoutWidth: 1000,
            starDensity: 200,
            particleDensity: 90,
            starColor: '#fff',
            particleColor: '#00ffd5',
            pattern: 'nebula'
        },
        classic: {
            name:'classic',
            bg: '#0b0b0b',
            text: '#ffffff',
            accent: '#4a9eff',
            radius: 10,
            shadow: 18,
            glow: 4,
            layoutWidth: 900,
            starDensity: 140,
            particleDensity: 40,
            starColor: '#ffffff',
            particleColor: 'cyan',
            pattern: 'starfield'
        },
        solar: {
            name:'solar',
            bg: '#1b1207',
            text: '#fff6e6',
            accent: '#ffb86b',
            radius: 8,
            shadow: 8,
            glow: 6,
            layoutWidth: 900,
            starDensity: 90,
            particleDensity: 20,
            starColor: '#fffbdf',
            particleColor: '#ffcc88',
            pattern: 'noise'
        },
        pastel: {
            name:'pastel',
            bg: '#f4f7ff',
            text: '#0b1330',
            accent: '#a78bfa',
            radius: 18,
            shadow: 6,
            glow: 0,
            layoutWidth: 1100,
            starDensity: 40,
            particleDensity: 10,
            starColor: '#001122',
            particleColor: '#a78bfa',
            pattern: 'grid'
        }
    };

    /* STARFIELD */
    const starContainer = document.getElementById("stars");
    function makeStars(count) {
        starContainer.innerHTML = '';
        for (let i = 0; i < count; i++) {
            let s = document.createElement("div");
            s.className = "star";
            s.style.top = Math.random() * 100 + "%";
            s.style.left = Math.random() * 100 + "%";
            s.style.animationDelay = Math.random() * 2 + "s";
            starContainer.appendChild(s);
        }
    }

    /* PARTICLES */
    const particleContainer = document.getElementById("particles");
    function makeParticles(count) {
        particleContainer.innerHTML = '';
        for (let i = 0; i < count; i++) {
            let p = document.createElement("div");
            p.className = "particle";
            p.style.top = Math.random() * 100 + "%";
            p.style.left = Math.random() * 100 + "%";
            p.style.animationDelay = Math.random() * 6 + "s";
            particleContainer.appendChild(p);
        }
    }

    /* RANDOMIZED BANNER ANIMATIONS (durations adjusted by animScale) */
    function buildAnimations(scale) {
        const base = [
            ["shimmer", 4],
            ["drift", 6],
            ["pulse", 5],
            ["wave", 6],
            ["warp", 5],
            ["glitch", 1]
        ];
        return base.map(([name, dur]) => `${name} ${Math.max(0.2, dur/scale)}s infinite ease-in-out`);
    }

    const banners = document.querySelectorAll("#banner img");
    let current = 0;
    let bannerInterval;

    function showBanner(animScale=1) {
        banners.forEach((b) => { b.classList.remove("active"); b.style.animation = ""; });
        const banner = banners[current];
        if (!banner) return;
        banner.classList.add("active");
        const animations = buildAnimations(animScale);
        const randomAnimation = animations[Math.floor(Math.random() * animations.length)];
        banner.style.animation = randomAnimation;
        current = (current + 1) % banners.length;
    }

    function startBannerLoop(animScale=1) {
        clearInterval(bannerInterval);
        showBanner(animScale);
        bannerInterval = setInterval(()=> showBanner(animScale), 5000);
    }

    startBannerLoop(1);

    /* MECARD FLOATING OBJECT */
    const mecard = document.getElementById("mecard");
    let floating = true;
    let floatTimer;

    function randomFloat() {
        if (!floating) return;
        const randTop = Math.random() * 70 + 10;
        const randLeft = Math.random() * 80 + 10;
        mecard.style.top = randTop + "%";
        mecard.style.left = randLeft + "%";
        floatTimer = setTimeout(randomFloat, 2000);
    }

    randomFloat();

    mecard.addEventListener("click", () => {
        floating = false;
        clearTimeout(floatTimer);
        mecard.style.transition = "transform 1s ease, top 1s ease, left 1s ease";
        mecard.style.top = "50%";
        mecard.style.left = "50%";
        mecard.style.transform = "translate(-50%, -50%) scale(1.35) rotate(0deg)";
        mecard.style.zIndex = "2001";
        setTimeout(() => { document.getElementById("founderModal").style.display = "flex"; document.getElementById("closeFounder").focus(); }, 600);
    });

    document.getElementById("closeFounder").addEventListener("click", () => {
        document.getElementById("founderModal").style.display = "none";
        mecard.style.transform = "scale(1)";
        floating = true; randomFloat();
    });

    /* CONTROLLER LOGIC */
    const root = document.documentElement;
    const body = document.body;
    const controls = {
        themeSelect: document.getElementById('themeSelect'),
        patternSelect: document.getElementById('patternSelect'),
        brightness: document.getElementById('brightness'),
        animIntensity: document.getElementById('animIntensity'),
        bg: document.getElementById('bg'),
        text: document.getElementById('text'),
        accent: document.getElementById('accent'),
        radius: document.getElementById('radius'),
        shadow: document.getElementById('shadow'),
        glow: document.getElementById('glow'),
        layoutWidth: document.getElementById('layoutWidth'),
        starDensity: document.getElementById('starDensity'),
        particleDensity: document.getElementById('particleDensity'),
    };

    function applySettings(s) {
        if (!s) return;
        if (s.bg) root.style.setProperty('--bg', s.bg);
        if (s.text) root.style.setProperty('--text', s.text);
        if (s.accent) root.style.setProperty('--accent', s.accent);
        if (typeof s.radius !== 'undefined') root.style.setProperty('--radius', s.radius + 'px');
        if (typeof s.shadow !== 'undefined') root.style.setProperty('--shadow', s.shadow + 'px');
        if (typeof s.glow !== 'undefined') root.style.setProperty('--glow', s.glow + 'px');
        if (typeof s.layoutWidth !== 'undefined') root.style.setProperty('--layout-width', s.layoutWidth + 'px');
        if (s.starColor) root.style.setProperty('--star-color', s.starColor);
        if (s.particleColor) root.style.setProperty('--particle-color', s.particleColor);

        // Update UI inputs to match where appropriate
        if (controls.bg && s.bg) controls.bg.value = s.bg;
        if (controls.text && s.text) controls.text.value = s.text;
        if (controls.accent && s.accent) controls.accent.value = s.accent;
        if (controls.radius && typeof s.radius !== 'undefined') controls.radius.value = s.radius;
        if (controls.shadow && typeof s.shadow !== 'undefined') controls.shadow.value = s.shadow;
        if (controls.glow && typeof s.glow !== 'undefined') controls.glow.value = s.glow;
        if (controls.layoutWidth && typeof s.layoutWidth !== 'undefined') controls.layoutWidth.value = s.layoutWidth;
        if (controls.starDensity && typeof s.starDensity !== 'undefined') controls.starDensity.value = s.starDensity;
        if (controls.particleDensity && typeof s.particleDensity !== 'undefined') controls.particleDensity.value = s.particleDensity;
    }

    function applyThemeByName(name) {
        if (!name || name === 'custom') return;
        const t = THEMES[name];
        if (!t) return;
        applySettings(t);
        // body class for theme and pattern
        Object.keys(THEMES).forEach(k => body.classList.remove('theme-'+k));
        body.classList.add('theme-'+t.name);
        // apply pattern
        setPattern(t.pattern || 'starfield');
        // stars/particles
        makeStars(t.starDensity || 150);
        makeParticles(t.particleDensity || 60);
    }

    function setPattern(name) {
        // remove existing pattern-* classes
        ['nebula','grid','noise','starfield'].forEach(p => body.classList.remove('pattern-'+p));
        const p = name || controls.patternSelect.value || 'starfield';
        body.classList.add('pattern-'+p);
        // special handling: if starfield, keep smoke transparent else show overlay opacity
        const smoke = document.querySelector('.smoke');
        if (!smoke) return;
        switch(p){
            case 'nebula': smoke.style.backgroundImage = "url('https://i.imgur.com/8fK4h7R.png')"; smoke.style.opacity=0.12; break;
            case 'grid': smoke.style.backgroundImage = "linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px)"; smoke.style.backgroundSize='40px 40px,40px 40px'; smoke.style.opacity=0.06; break;
            case 'noise': smoke.style.backgroundImage = "url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'400\'><filter id=\'n\'><feTurbulence baseFrequency=\'0.8\' numOctaves=\'2\' stitchTiles=\'stitch\'/></filter><rect width=\'100%\' height=\'100%\' filter=\'url(%23n)\' fill=\'white\'/></svg>')"; smoke.style.opacity=0.06; break;
            default: smoke.style.backgroundImage='none'; smoke.style.opacity=0.0; break;
        }
    }

    function setBrightness(v) { root.style.setProperty('--brightness', v); }
    function setAnimScale(v) { root.style.setProperty('--anim-scale', v); startBannerLoop(v); document.querySelectorAll('.star').forEach(s => s.style.animationDuration = (2 / v) + 's'); document.querySelectorAll('.particle').forEach(p => p.style.animationDuration = (6 / v) + 's'); document.getElementById('mecard').style.animationDuration = (3 / v) + 's'; }

    function readUI() {
        return {
            theme: controls.themeSelect.value,
            pattern: controls.patternSelect.value,
            brightness: parseFloat(controls.brightness.value),
            animIntensity: parseFloat(controls.animIntensity.value),
            bg: controls.bg.value,
            text: controls.text.value,
            accent: controls.accent.value,
            radius: parseInt(controls.radius.value,10),
            shadow: parseInt(controls.shadow.value,10),
            glow: parseInt(controls.glow.value,10),
            layoutWidth: parseInt(controls.layoutWidth.value,10),
            starDensity: parseInt(controls.starDensity.value,10),
            particleDensity: parseInt(controls.particleDensity.value,10),
        };
    }

    function saveTheme() {
        const data = readUI();
        localStorage.setItem('chronicTheme', JSON.stringify(data));
        alert('Theme saved locally');
    }

    function loadTheme() {
        const raw = localStorage.getItem('chronicTheme');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch(e){ return null; }
    }

    function resetTheme() {
        localStorage.removeItem('chronicTheme');
        // apply classic defaults
        applyThemeByName('classic');
        controls.themeSelect.value = 'classic';
        controls.brightness.value = 1;
        setBrightness(1);
        controls.animIntensity.value = 1;
        setAnimScale(1);
    }

    // wire up simple UI events
    controls.themeSelect.addEventListener('change', (e)=>{
        const v = e.target.value;
        if (v === 'custom') return; // don't override custom
        applyThemeByName(v);
    });

    controls.patternSelect.addEventListener('change', (e)=> setPattern(e.target.value));
    controls.brightness.addEventListener('input', (e)=> setBrightness(e.target.value));
    controls.animIntensity.addEventListener('input', (e)=> setAnimScale(e.target.value));

    // existing color/layout controls
    ['bg','text','accent','radius','shadow','glow','layoutWidth','starDensity','particleDensity'].forEach(k=>{
        const el = controls[k];
        if (!el) return;
        el.addEventListener('input', ()=>{
            const v = el.value;
            switch(k){
                case 'bg': root.style.setProperty('--bg', v); break;
                case 'text': root.style.setProperty('--text', v); break;
                case 'accent': root.style.setProperty('--accent', v); break;
                case 'radius': root.style.setProperty('--radius', v + 'px'); break;
                case 'shadow': root.style.setProperty('--shadow', v + 'px'); break;
                case 'glow': root.style.setProperty('--glow', v + 'px'); break;
                case 'layoutWidth': root.style.setProperty('--layout-width', v + 'px'); break;
                case 'starDensity': makeStars(parseInt(v,10)); break;
                case 'particleDensity': makeParticles(parseInt(v,10)); break;
            }
        });
    });

    document.getElementById('saveTheme').addEventListener('click', saveTheme);
    document.getElementById('resetTheme').addEventListener('click', resetTheme);

    // Export / import
    document.getElementById('exportTheme').addEventListener('click', ()=>{
        const data = readUI();
        const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download='chronic-theme.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    document.getElementById('importTheme').addEventListener('click', ()=> document.getElementById('importData').click());
    document.getElementById('importData').addEventListener('change', (e)=>{
        const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ()=>{ try{ const obj = JSON.parse(r.result); if (obj.theme && obj.theme !== 'custom') { controls.themeSelect.value = obj.theme; applyThemeByName(obj.theme); } else { applySettings(obj); if (obj.starDensity) makeStars(obj.starDensity); if (obj.particleDensity) makeParticles(obj.particleDensity); } if (obj.pattern) controls.patternSelect.value = obj.pattern; setPattern(obj.pattern); if (obj.brightness) { controls.brightness.value = obj.brightness; setBrightness(obj.brightness); } if (obj.animIntensity) { controls.animIntensity.value = obj.animIntensity; setAnimScale(obj.animIntensity); } alert('Imported theme applied'); }catch(err){ alert('Invalid theme file'); } }; r.readAsText(f);
    });

    // Controller open/close
    const toggle = document.getElementById('controllerToggle');
    const controller = document.getElementById('styleController');
    toggle.addEventListener('click', ()=>{
        const open = controller.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) controller.querySelector('select, input, button').focus(); else toggle.focus();
    });

    document.addEventListener('keydown', (e)=>{
        if (e.key === 'Escape') {
            if (controller.classList.contains('open')) { controller.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); toggle.focus(); }
            if (document.getElementById('founderModal').style.display === 'flex') { document.getElementById('founderModal').style.display = 'none'; mecard.style.transform='scale(1)'; floating=true; randomFloat(); }
        }
    });

    // initialize
    (function init(){
        const saved = loadTheme();
        if (saved) {
            // if theme preset
            if (saved.theme && saved.theme !== 'custom') { controls.themeSelect.value = saved.theme; applyThemeByName(saved.theme); }
            else { applySettings(saved); makeStars(saved.starDensity || 150); makeParticles(saved.particleDensity || 60); }
            if (saved.pattern) { controls.patternSelect.value = saved.pattern; setPattern(saved.pattern); }
            if (saved.brightness) { controls.brightness.value = saved.brightness; setBrightness(saved.brightness); }
            if (saved.animIntensity) { controls.animIntensity.value = saved.animIntensity; setAnimScale(saved.animIntensity); }
        } else {
            // apply default preset
            controls.themeSelect.value = 'classic';
            applyThemeByName('classic');
            controls.brightness.value = 1; setBrightness(1);
            controls.animIntensity.value = 1; setAnimScale(1);
        }
    })();

    // respect prefers-reduced-motion
    const media = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (media.matches) document.querySelectorAll('*').forEach(el=>el.style.animation = 'none');

</script>

</body>
</html>
